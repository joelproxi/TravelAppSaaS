name: CI - Full Synchronized Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint & Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Project
        uses: ./.github/actions/setup

      - name: Checkstyle
        run: mvn -B checkstyle:check -Dcheckstyle.config.location=quality/checkstyle.xml || true

      - name: PMD Analysis
        run: mvn -B pmd:check || true

      - name: YAML Lint
        run: |
          pip install yamllint
          yamllint -d relaxed .gitlab-ci.yml .gitlab/ci/ || true

      - name: Dockerfile Lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008

  build:
    name: Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Project
        uses: ./.github/actions/setup

      - name: Compile
        run: mvn -B clean compile -DskipTests

      - name: Cache Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: |
            target/classes/
            target/generated-sources/
          retention-days: 1

  test:
    name: Tests (Unit, Integration, ArchUnit)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Project
        uses: ./.github/actions/setup
      
      - name: Download Compiled Classes
        uses: actions/download-artifact@v4
        with:
          name: compiled-classes
          path: target/

      - name: Run Unit Tests
        run: mvn -B test -Dsurefire.reportFormat=plain -Djacoco.skip=false

      - name: Run Integration Tests
        run: mvn -B verify -DskipUnitTests=true -Dfailsafe.rerunFailingTestsCount=2

      - name: Run Architecture Tests
        run: mvn -B test -Dtest="com.travelapp.architecture.*" -DfailIfNoTests=false

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/

  analysis:
    name: Advanced Analysis
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Project
        uses: ./.github/actions/setup
      
      - name: Dependency Tree
        run: |
          mvn -B dependency:tree > dependency-tree.txt
          mvn -B versions:display-dependency-updates > dependency-updates.txt || true

      - name: Mutation Tests (PIT)
        run: mvn -B org.pitest:pitest-maven:mutationCoverage || true

      - name: Upload Analysis Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            dependency-tree.txt
            dependency-updates.txt
            target/pit-reports/
