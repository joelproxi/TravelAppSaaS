
# ============================================================
#  TEST — Tests unitaires + intégration + couverture
# ============================================================

unit-tests:
  stage: test
  image: $MAVEN_IMAGE
  <<: *maven-cache
  <<: *postgres-service
  needs:
    - job: compile
      artifacts: true
  script:
    - echo "🧪 Exécution des tests unitaires..."
    - >
      mvn $MAVEN_CLI_OPTS test
      -Dsurefire.reportFormat=plain
      -Dsurefire.useFile=false
    - echo "📊 Génération du rapport JaCoCo..."
    - mvn $MAVEN_CLI_OPTS jacoco:report
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    paths:
      - target/surefire-reports/
      - target/site/jacoco/
      - target/jacoco.exec
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  tags:
    - docker

integration-tests:
  stage: test
  image: $MAVEN_IMAGE
  <<: *maven-cache
  <<: *postgres-service
  needs:
    - job: compile
      artifacts: true
  variables:
    # Testcontainers utilise le daemon Docker de GitLab Runner
    TESTCONTAINERS_RYUK_DISABLED: "true"
    DOCKER_HOST: "tcp://docker:2375"
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
  script:
    - echo "🧪 Exécution des tests d'intégration..."
    - >
      mvn $MAVEN_CLI_OPTS verify
      -DskipUnitTests=true
      -Dfailsafe.rerunFailingTestsCount=2
  artifacts:
    when: always
    paths:
      - target/failsafe-reports/
    reports:
      junit: target/failsafe-reports/TEST-*.xml
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  tags:
    - docker

architecture-tests:
  stage: test
  image: $MAVEN_IMAGE
  <<: *maven-cache
  <<: *postgres-service
  needs:
    - job: compile
      artifacts: true
  script:
    - echo "🏗️ Tests d'architecture (ArchUnit)..."
    - >
      mvn $MAVEN_CLI_OPTS test
      -Dtest="com.travelapp.architecture.*"
      -DfailIfNoTests=false
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  allow_failure: false
  tags:
    - docker

mutation-tests:
  stage: test
  image: $MAVEN_IMAGE
  <<: *maven-cache
  <<: *postgres-service
  needs:
    - job: compile
      artifacts: true
  script:
    - echo "🧬 Tests de mutation (PIT)..."
    - mvn $MAVEN_CLI_OPTS org.pitest:pitest-maven:mutationCoverage || true
  artifacts:
    when: always
    paths:
      - target/pit-reports/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
  tags:
    - docker